[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infrascan-platform"
version = "0.1.0"
description = "InfraScan platform — 360° walkthrough capture, navigation, and cross-space object search."
authors = [{ name = "Chan Kim" }]
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Server
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",      # session cookie signing
    "argon2-cffi>=23.1",      # password hashing

    # Data
    "pydantic>=2.5",
    "numpy>=1.26",
    "Pillow>=10",

    # Search index (CPU at run-time; GPU is offline-only)
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
# pipeline = batch jobs only, not needed to run the server.
pipeline = [
    "torch>=2.0",
    "torchvision",
    "open3d>=0.18",
    "scikit-learn>=1.3",
    "tqdm",
    "ultralytics>=8.3",       # object proposals model
    "huggingface-hub>=0.20",
]

# query-time-only optional deps (GPU dedup at the moment of a click)
gpu = [
    "torch>=2.0",
]

dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
    "ruff>=0.3",
]

[project.scripts]
infrascan = "scripts.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*", "pipeline*"]
exclude = ["tests*", "data*", "out*", "external*"]

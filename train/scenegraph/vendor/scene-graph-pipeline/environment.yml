name: scene-graph-pipeline
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # scientific stack
  - numpy=1.26.*
  - scipy=1.17.*
  - scikit-learn=1.8.*
  - pillow=10.4.*

  # point cloud / spatial
  - open3d=0.18.*

  - pip:
      # install a torch/torchvision build matching your CUDA version, e.g.:
      #   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
      - torch
      - torchvision

      - opencv-python==4.11.0.86
      - plyfile==1.1.3
      - open_clip_torch
